<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Planner Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-md items-center px-4 py-8 sm:px-6">
        <section class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold text-blue-700 sm:text-3xl">Task Planner</h1>
                <p class="mt-2 text-sm text-slate-500">Sign in to access your dashboard</p>
            </div>

            {% if request.query_params.get('error') %}
            <div class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
                Invalid username or password.
            </div>
            {% endif %}

            <form action="/login" method="post" class="space-y-4">
                <label class="block text-sm font-medium text-slate-700">
                    Username
                    <input type="text" name="username" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none ring-blue-500 focus:ring-2" required>
                </label>

                <label class="block text-sm font-medium text-slate-700">
                    Password
                    <input type="password" name="password" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-900 outline-none ring-blue-500 focus:ring-2" required>
                </label>

                <button type="submit" class="w-full rounded-lg bg-blue-600 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700">
                    Enter Dashboard
                </button>
            </form>
        </section>
    </main>
</body>
</html>
